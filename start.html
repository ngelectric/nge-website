<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>New Ground Electric | Southern California Electrician</title>
<meta name="description" content="Licensed C-10 Electrical Contractor serving San Diego County and the Inland Empire. Request a free estimate from New Ground Electric.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/images/nge-logo-transparent_5b2df02c.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1a3a2a;
  --green-light:#e8f0eb;
  --amber:#f59e0b;
  --white:#ffffff;
  --gray:#f9fafb;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 2px 20px rgba(0,0,0,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;}
html{min-height:100vh;background:var(--gray);}
body{
  font-family:'Inter',sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

/* CARD */
.card{
  background:var(--white);
  border-radius:24px;
  box-shadow:0 8px 40px rgba(0,0,0,0.10);
  width:100%;
  max-width:460px;
  padding:36px 32px 28px;
  border:1px solid var(--border);
}

/* LOGO */
.logo-wrap{
  text-align:center;
  margin-bottom:20px;
}
.logo-wrap img{
  height:64px;
  width:auto;
  object-fit:contain;
}

/* IDENTITY */
.identity{
  text-align:center;
  margin-bottom:20px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
}
.company-name{
  font-size:20px;
  font-weight:800;
  color:var(--green);
  letter-spacing:0.3px;
  margin-bottom:12px;
}
.owner-name{
  font-size:16px;
  font-weight:700;
  color:var(--text);
  margin-bottom:3px;
}
.owner-title{
  font-size:12px;
  color:var(--muted);
  font-weight:500;
  margin-bottom:12px;
}
.tagline{
  font-size:11px;
  color:var(--muted);
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:12px;
}
.credential{
  font-size:11px;
  color:var(--muted);
  line-height:1.7;
}
.credential a{
  color:var(--green);
  text-decoration:underline dotted;
}

/* TRUST BADGES */
.trust-row{
  display:flex;
  gap:6px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.trust-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:var(--gray);
  border:1px solid var(--border);
  border-radius:999px;
  padding:5px 11px;
  font-size:11px;
  font-weight:600;
  color:var(--green);
  white-space:nowrap;
  text-decoration:none;
  transition:background 0.2s;
}
.trust-badge:hover,
.trust-badge:active{
  background:var(--green-light);
}
.trust-dot{color:var(--amber);}

/* PRIMARY BUTTON */
.btn-primary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background:var(--green);
  color:white;
  padding:17px 24px;
  border-radius:var(--radius);
  font-size:16px;
  font-weight:700;
  text-decoration:none;
  margin-bottom:10px;
  transition:background 0.2s,transform 0.1s;
  min-height:56px;
}
.btn-primary:active{
  background:#0e2419;
  transform:scale(0.98);
}
.btn-primary svg{flex-shrink:0;}

/* SECONDARY BUTTONS */
.btn-secondary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background:var(--white);
  color:var(--green);
  padding:14px 24px;
  border-radius:var(--radius);
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  margin-bottom:8px;
  border:1.5px solid var(--border);
  transition:background 0.2s,transform 0.1s;
  min-height:50px;
}
.btn-secondary:active{
  background:var(--gray);
  transform:scale(0.98);
}
.btn-secondary svg{flex-shrink:0;}
.btn-secondary.review{
  border-color:#fde68a;
  background:#fffbeb;
}

/* DIVIDER */
.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:16px 0;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:1px;
}
.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}

/* QUICK CONTACT */
.quick-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:16px;
}
.btn-quick{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  background:var(--gray);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:14px 8px;
  font-size:11px;
  font-weight:700;
  color:var(--green);
  text-decoration:none;
  text-transform:uppercase;
  letter-spacing:0.5px;
  transition:background 0.2s,transform 0.1s;
  min-height:62px;
}
.btn-quick:active{
  background:var(--green-light);
  transform:scale(0.97);
}

/* SOCIAL ROW */
.social-row{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-bottom:20px;
}
.btn-social{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 18px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  text-decoration:none;
  border:1.5px solid var(--border);
  color:var(--green);
  background:var(--white);
  transition:background 0.2s;
}
.btn-social:active{background:var(--gray);}

/* FOOTER */
.footer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  line-height:1.8;
  padding-top:16px;
  border-top:1px solid var(--border);
}
.footer a{
  color:var(--muted);
  text-decoration:none;
}

/* DESKTOP — wider card, subtle green left border */
@media (min-width:640px){
  .card{
    max-width:520px;
    border-left:4px solid var(--green);
  }
}
</style>
</head>
<body>

<script>
const NGE = {

</script>

<div class="card">

  <!-- LOGO -->
  <div class="logo-wrap">

  <!-- IDENTITY -->
  <div class="identity">

  <!-- TRUST BADGES -->

      <span class="trust-dot">

    <a class="trust-badge" id="badgeBond"
      target="_blank" rel="noopener">
      <span class="trust-dot">

      Fully Insured
    </a>
    <a class="trust-badge" id="badgeBBB"
      target="_blank" rel="noopener">
      <span class="trust-dot">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="#f59e0b" stroke-width="2.5"

          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </span>
      BBB Accredited
    </a>
    <a class="trust-badge" id="badgeReview"
      target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#f59e0b"
        width="11" height="11">
        <polygon points="12 2 15.09 8.26 22 9.27 
          17 14.14 18.18 21.02 12 17.77 5.82 
          21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      5-Star Rated
    </a>
  </div>

  <!-- PRIMARY CTA -->
  <a class="btn-primary" id="btnEstimate">
    <svg viewBox="0 0 24 24" fill="none"
      stroke="white" stroke-width="2"
      width="20" height="20">
      <circle cx="12" cy="12" r="10"/>

    Request a Free Estimate
  </a>

  <!-- SECONDARY BUTTONS -->
  <a class="btn-secondary" id="btnProjects"

    <svg viewBox="0 0 24 24" fill="none"
      stroke="#1a3a2a" stroke-width="2"
      width="18" height="18">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    View Recent Projects
  </a>

  <a class="btn-secondary" id="btnWebsite"
    target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none"
      stroke="#1a3a2a" stroke-width="2"

      <circle cx="12" cy="12" r="10"/>

      <path d="M12 2a15.3 15.3 0 0 1 4 10

    Visit Our Website
  </a>

  <a class="btn-secondary review" id="btnReview"

    <svg viewBox="0 0 24 24" fill="#f59e0b"

        17 14.14 18.18 21.02 12 17.77 5.82

    </svg>
    Leave a Google Review
  </a>

  <!-- DIVIDER -->
  <div class="divider">Quick Contact</div>

  <!-- QUICK CONTACT -->
  <div class="quick-row">
    <a class="btn-quick" id="btnCall">
      <svg viewBox="0 0 24 24" fill="none"

        <path d="M22 16.92v3a2 2 0 0 1-2.18

    <a class="btn-quick" id="btnEmail">
      <svg viewBox="0 0 24 24" fill="none"
        stroke="#1a3a2a" stroke-width="2"

        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0

          0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>

    </a>
  </div>

  <!-- SOCIAL ROW -->
  <div class="social-row">
    <a class="btn-social" id="btnTikTok"

      <svg viewBox="0 0 24 24" width="15"

  <!-- FOOTER -->

<script>
/* Wire config to DOM */
document.getElementById('logo').src = NGE.logo;
document.getElementById('companyName')
  .textContent = NGE.name;
document.getElementById('tagline')
  .textContent = NGE.tagline;
document.getElementById('ownerName').textContent = NGE.owner;
document.getElementById('ownerTitle').textContent = NGE.ownerTitle;
document.getElementById('credential')
  .innerHTML = NGE.license + 
  ' &nbsp;·&nbsp; ' + NGE.area;

/* Trust badges */
document.getElementById('badgeLicense')
  .href = NGE.cslb;
document.getElementById('badgeBond')
  .href = NGE.bond;
document.getElementById('badgeBBB')
  .href = NGE.bbb;
document.getElementById('badgeReview')
  .href = "https://www.google.com/maps/search/New+Ground+Electric+Temecula+CA";

/* Primary */
document.getElementById('btnEstimate')
  .href = NGE.estimate;

/* Secondary */
document.getElementById('btnProjects')
  .href = NGE.instagram;
document.getElementById('btnWebsite')
  .href = NGE.website;
document.getElementById('btnReview')
  .href = NGE.review;

/* Quick contact */
document.getElementById('btnCall')
  .href = 'tel:' + NGE.phone;
document.getElementById('btnText')
  .href = 'sms:' + NGE.phone + 
  '?body=' + encodeURIComponent(NGE.smsMessage);
document.getElementById('btnEmail')
  .href = 'mailto:' + NGE.email;

/* Social */
document.getElementById('btnTikTok')
  .href = NGE.tiktok;
document.getElementById('btnIG')
  .href = NGE.instagram;

/* Footer */
document.getElementById('footerLine')
  .innerHTML = '<a href="' + NGE.cslb + 
  '" target="_blank">' + NGE.license + 
  '</a>';
document.getElementById('footerCopy')
  .textContent = '© ' + NGE.year + 
  ' ' + NGE.name + ' Inc.';
</script>

</body>
</html>
