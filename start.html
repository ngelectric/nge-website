<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>New Ground Electric | Southern California Electrician</title>
<meta name="description" content="Licensed C-10 Electrical Contractor serving San Diego County and the Inland Empire. Request a free estimate from New Ground Electric.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="images/nge-logo-transparent_5b2df02c.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ═══ CONFIG-DRIVEN — edit only the :root vars ═══ */
:root {
  --green: #1a3a2a;
  --green-light: #e8f0eb;
  --amber: #f59e0b;
  --amber-dark: #d97706;
  --white: #ffffff;
  --gray: #f9fafb;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --radius: 14px;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  font-family:'Inter',sans-serif;
  background:var(--white);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}
body{
  padding:32px 20px 24px;
  max-width:420px;
  margin:0 auto;
  width:100%;
}

/* LOGO */
.logo-wrap{
  text-align:center;
  margin-bottom:16px;
}
.logo-wrap img{
  height:72px;
  width:auto;
  object-fit:contain;
}

/* IDENTITY */
.identity{
  text-align:center;
  margin-bottom:20px;
}
.company-name{
  font-size:20px;
  font-weight:800;
  color:var(--green);
  letter-spacing:0.5px;
  margin-bottom:4px;
}
.tagline{
  font-size:13px;
  color:var(--muted);
  font-weight:500;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.credential{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}
.credential a{
  color:var(--green);
  text-decoration:underline dotted;
}

/* TRUST BADGES */
.trust-row{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.trust-badge{
  display:flex;
  align-items:center;
  gap:5px;
  background:var(--gray);
  border:1px solid var(--border);
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  font-weight:600;
  color:var(--green);
  white-space:nowrap;
}
.trust-badge.clickable{
  cursor:pointer;
  text-decoration:none;
  transition:background 0.2s;
}
.trust-badge.clickable:hover,
.trust-badge.clickable:active{
  background:var(--green-light);
}
.trust-badge .dot{
  color:var(--amber);
  font-size:14px;
}

/* DIVIDER */
.divider{
  width:40px;
  height:2px;
  background:var(--border);
  margin:0 auto 24px;
  border-radius:2px;
}

/* PRIMARY CTA */
.btn-primary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background:var(--green);
  color:white;
  padding:18px 24px;
  border-radius:var(--radius);
  font-size:17px;
  font-weight:700;
  text-decoration:none;
  margin-bottom:10px;
  box-shadow:var(--shadow);
  transition:background 0.2s,transform 0.1s;
  min-height:58px;
}
.btn-primary:active{
  background:#0e2419;
  transform:scale(0.98);
}
.btn-primary .icon{
  font-size:20px;
}

/* SECONDARY BUTTONS */
.btn-secondary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background:var(--white);
  color:var(--green);
  padding:15px 24px;
  border-radius:var(--radius);
  font-size:15px;
  font-weight:600;
  text-decoration:none;
  margin-bottom:10px;
  border:1.5px solid var(--border);
  box-shadow:var(--shadow);
  transition:background 0.2s,
    border-color 0.2s,transform 0.1s;
  min-height:52px;
}
.btn-secondary:active{
  background:var(--gray);
  transform:scale(0.98);
}
.btn-secondary .icon{
  font-size:18px;
}
.btn-secondary.review{
  border-color:#fde68a;
  background:#fffbeb;
}
.btn-secondary.review:active{
  background:#fff8e6;
}

/* QUICK CONTACT */
.quick-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:24px;
  margin-top:4px;
}
.btn-quick{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  background:var(--gray);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:14px 8px;
  font-size:12px;
  font-weight:600;
  color:var(--green);
  text-decoration:none;
  transition:background 0.2s,transform 0.1s;
  min-height:64px;
}
.btn-quick:active{
  background:var(--green-light);
  transform:scale(0.97);
}
.btn-quick .icon{
  font-size:20px;
}

/* SOCIAL ROW */
.social-row{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:24px;
}
.btn-social{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 20px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  border:1.5px solid var(--border);
  color:var(--green);
  background:var(--white);
  transition:background 0.2s;
}
.btn-social:active{
  background:var(--gray);
}
.btn-social svg{
  flex-shrink:0;
}

/* FOOTER */
.footer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  line-height:1.8;
  padding-top:16px;
  border-top:1px solid var(--border);
  width:100%;
}
.footer a{
  color:var(--muted);
  text-decoration:none;
}
.footer a:hover{
  text-decoration:underline;
}
</style>
</head>
<body>

<script>
/* ═══════════════════════════════════════
   CONFIG — UPDATE THIS BLOCK ONLY
   Never need to touch the HTML below
═══════════════════════════════════════ */
const NGE = {
  name:        "New Ground Electric",
  tagline:     "Clean • Quality • Reliable",
  license:     "CA C-10 License #1153189",
  area:        "Serving San Diego & Inland Empire",
  phone:       "+19517564030",
  phoneDisplay:"(951) 756-4030",
  email:       "info@newgroundelectric.com",
  smsMessage:  "Hi Mario, I found your card and wanted to reach out about electrical work.",
  website:     "https://newgroundelectric.com",
  estimate:    "https://newgroundelectric.com/contact.html",
  review:      "https://newgroundelectric.com/review",
  instagram:   "https://www.instagram.com/newgroundelectric",
  tiktok:      "https://www.tiktok.com/@newgroundelectric",
  bbb:         "https://www.bbb.org/us/ca/temecula/profile/electrician/new-ground-electric-inc-1126-1000169760",
  cslb:        "https://www.cslb.ca.gov/OnlineServices/CheckLicenseII/LicenseDetail.aspx?LicNum=1153189",
  logo:        "images/nge-logo-transparent_5b2df02c.png",
  year:        new Date().getFullYear()
};
</script>

<!-- LOGO -->
<div class="logo-wrap">
  <img id="logo" alt="New Ground Electric Logo">
</div>

<!-- IDENTITY -->
<div class="identity">
  <p class="company-name" id="companyName"></p>
  <p class="tagline" id="tagline"></p>
  <p class="credential" id="credential"></p>
</div>

<!-- TRUST BADGES -->
<div class="trust-row">
  <a class="trust-badge clickable" id="badgeLicense" target="_blank" rel="noopener">
    <span class="dot">✓</span> C-10 Licensed
  </a>
  <span class="trust-badge">
    <span class="dot">✓</span> Fully Insured
  </span>
  <a class="trust-badge clickable" id="badgeBBB" target="_blank" rel="noopener">
    <span class="dot">✓</span> BBB Accredited
  </a>
  <a class="trust-badge clickable" id="badgeReviewStar" target="_blank" rel="noopener">
    <span class="dot">⭐</span> 5-Star Rated
  </a>
</div>

<div class="divider"></div>

<!-- PRIMARY CTA -->
<a class="btn-primary" id="btnEstimate">
  <span class="icon">⚡</span>
  Request a Free Estimate
</a>

<!-- SECONDARY BUTTONS -->
<a class="btn-secondary" id="btnInstagram" target="_blank" rel="noopener">
  <span class="icon">📸</span>
  View Recent Projects
</a>

<a class="btn-secondary" id="btnWebsite" target="_blank" rel="noopener">
  <span class="icon">🌐</span>
  Visit Our Website
</a>

<a class="btn-secondary review" id="btnReview" target="_blank" rel="noopener">
  <span class="icon">⭐</span>
  Leave a Google Review
</a>

<!-- QUICK CONTACT -->
<div class="quick-row">
  <a class="btn-quick" id="btnCall">
    <span class="icon">📞</span>
    Call
  </a>
  <a class="btn-quick" id="btnText">
    <span class="icon">💬</span>
    Text
  </a>
  <a class="btn-quick" id="btnEmail">
    <span class="icon">✉️</span>
    Email
  </a>
</div>

<!-- SOCIAL ROW -->
<div class="social-row">
  <a class="btn-social" id="btnTikTok" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="#1a3a2a">
      <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1-.07z"/>
    </svg>
    TikTok
  </a>
  <a class="btn-social" id="btnIG" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#1a3a2a" stroke-width="2">
      <rect x="2" y="2" width="20" height="20" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.5" cy="6.5" r="1" fill="#1a3a2a" stroke="none"/>
    </svg>
    Instagram
  </a>
</div>

<!-- FOOTER -->
<div class="footer">
  <p id="footerName"></p>
  <p id="footerLicense"></p>
  <p><a id="footerPhone"></a> &nbsp;·&nbsp; <a id="footerEmail"></a></p>
  <p><a id="footerWebsite"></a></p>
  <p id="footerCopy"></p>
</div>

<script>
/* Wire config to DOM */
document.getElementById('logo').src = NGE.logo;
document.getElementById('logo').alt = NGE.name + ' Logo';
document.getElementById('companyName').textContent = NGE.name;
document.getElementById('tagline').textContent = NGE.tagline;
document.getElementById('credential').innerHTML =
  NGE.license + ' &nbsp;·&nbsp; Licensed & Insured<br>' + NGE.area;

/* Trust badges */
document.getElementById('badgeLicense').href = NGE.cslb;
document.getElementById('badgeBBB').href = NGE.bbb;
document.getElementById('badgeReviewStar').href = NGE.review;

/* Primary */
document.getElementById('btnEstimate').href = NGE.estimate;

/* Secondary */
document.getElementById('btnInstagram').href = NGE.instagram;
document.getElementById('btnWebsite').href = NGE.website;
document.getElementById('btnReview').href = NGE.review;

/* Quick contact */
document.getElementById('btnCall').href = 'tel:' + NGE.phone;
document.getElementById('btnText').href =
  'sms:' + NGE.phone + '?body=' +
  encodeURIComponent(NGE.smsMessage);
document.getElementById('btnEmail').href =
  'mailto:' + NGE.email;

/* Social */
document.getElementById('btnTikTok').href = NGE.tiktok;
document.getElementById('btnIG').href = NGE.instagram;

/* Footer */
document.getElementById('footerName').textContent = NGE.name;
document.getElementById('footerLicense').textContent = NGE.license;
document.getElementById('footerPhone').textContent = NGE.phoneDisplay;
document.getElementById('footerPhone').href = 'tel:' + NGE.phone;
document.getElementById('footerEmail').textContent = NGE.email;
document.getElementById('footerEmail').href = 'mailto:' + NGE.email;
document.getElementById('footerWebsite').textContent = 'newgroundelectric.com';
document.getElementById('footerWebsite').href = NGE.website;
document.getElementById('footerCopy').textContent =
  '© ' + NGE.year + ' ' + NGE.name +
  ' Inc. All rights reserved.';
</script>

</body>
</html>
